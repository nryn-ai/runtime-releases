name: release

# Builds, checks, signs and publishes one Nryn Runtime release.
#
# Trigger: pushing tag v<MAJOR.MINOR.PATCH> to nryn-ai/runtime-releases (only
# the owner and admins may, by tag ruleset). The source is the private
# nryn-ai/runtime at the same tag, checked out with a read-only deploy key.
# Both secrets (RUNTIME_SOURCE_DEPLOY_KEY, OLD_NAMES_PATTERN) live in the
# protected `release` environment, which only the build job enters.
#
# Jobs, each with only the permissions it needs:
#   preflight  contents: read    refuse a tag whose release exists
#   build      contents: read    test, build, check (amd64 and arm64, natively)
#   sign       id-token: write   SHA256SUMS + keyless cosign signature
#   publish    contents: write   re-verify, then create the release
#
# The signature identity is the one Nryn OS verifies (build.sh verify_release):
#   https://github.com/nryn-ai/runtime-releases/.github/workflows/release.yml@refs/tags/v<version>
#
# Releases are immutable: nothing here edits, replaces or deletes an asset. A
# bad release is superseded by a new version.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The Go toolchain the release is built with, pinned by the SHA-256 that
  # https://go.dev/dl/?mode=json publishes for each archive. Move all three
  # together.
  GO_VERSION: "1.26.8"
  GO_SHA256_AMD64: d0f743b33e8d8945e6b1f432edd15785c70507121d6e2a723b21285eddf8b57b
  GO_SHA256_ARM64: 211ffced9dcb9633a55eac6364816ec0ddd951389a740e88fa8b3337971bdda0

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check the repository, the tag, and that no release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REPOSITORY" != nryn-ai/runtime-releases ]; then
            echo "::error::releases are made only by nryn-ai/runtime-releases (this is $GITHUB_REPOSITORY)"; exit 1
          fi
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME exists already; releases are never edited (publish a new version)"
            exit 1
          fi

  build:
    name: build (${{ matrix.arch }})
    needs: preflight
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Check out nryn-ai/runtime at ${{ github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nryn-ai/runtime
          ref: refs/tags/${{ github.ref_name }}
          ssh-key: ${{ secrets.RUNTIME_SOURCE_DEPLOY_KEY }}
          path: src
          persist-credentials: false

      - name: Install the pinned Go toolchain
        run: |
          case "${{ matrix.arch }}" in
            amd64) sum="$GO_SHA256_AMD64" ;;
            arm64) sum="$GO_SHA256_ARM64" ;;
          esac
          f="go${GO_VERSION}.linux-${{ matrix.arch }}.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$f" "https://go.dev/dl/$f"
          echo "$sum  /tmp/$f" | sha256sum -c -
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf "/tmp/$f"
          echo /usr/local/go/bin >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          echo "GOFLAGS=-mod=mod" >> "$GITHUB_ENV"
          echo "GOPROXY=off" >> "$GITHUB_ENV"

      - name: Check the source version
        run: |
          # Read whole outputs before matching: under pipefail, a reader that exits
          # early (grep -q, head) can SIGPIPE the writer and fail or flip the check.
          gov="$(go version)"
          [[ "$gov " == *"go${GO_VERSION} "* ]] || { echo "::error::wrong Go: $gov"; exit 1; }
          got="$(cat src/VERSION)"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::nryn-ai/runtime at $GITHUB_REF_NAME is version $got, not $VERSION"; exit 1
          fi
          # no third-party modules: go.mod requires nothing
          if grep -Eq '^\s*require' src/go.mod; then
            echo "::error::go.mod requires modules; list them in THIRD_PARTY_NOTICES.md.in and the SBOM first"; exit 1
          fi
          echo "SOURCE_COMMIT=$(git -C src rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git -C src log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Test the source (the whole suite, -tags nryn)
        working-directory: src
        run: |
          go vet -tags nryn ./...
          go test -tags nryn ./...

      - name: Build both architectures
        working-directory: src
        run: |
          scripts/build.sh "$VERSION" ../out
          mkdir -p ../out/assets
          cp ../out/nryn-runtime_"${VERSION}"_linux_${{ matrix.arch }}.* ../out/assets/

      - name: Acceptance check (strings gate, version, licence, help)
        env:
          # the spec's regex of old product names; a secret, so that this
          # public repository never spells them out. The gate prints counts
          # and names of checks only, never matched text.
          OLD_NAMES_PATTERN: ${{ secrets.OLD_NAMES_PATTERN }}
        run: |
          if [ -z "$OLD_NAMES_PATTERN" ]; then
            echo "::error::the release environment has no OLD_NAMES_PATTERN secret"; exit 1
          fi
          for a in amd64 arm64; do
            mode=--strings-only
            [ "$a" = "${{ matrix.arch }}" ] && mode=
            src/scripts/acceptance.sh "out/$a/nryn-runtimed" "$VERSION" $mode
          done

      - name: Install it as the Nryn OS image build does, and use it
        run: |
          mkdir -p /tmp/unpack
          tar -xzf "out/assets/nryn-runtime_${VERSION}_linux_${{ matrix.arch }}.tar.gz" -C /tmp/unpack nryn-runtimed THIRD_PARTY_NOTICES.md
          cmp /tmp/unpack/nryn-runtimed "out/${{ matrix.arch }}/nryn-runtimed"
          ver="$(/tmp/unpack/nryn-runtimed --version)"
          grep -Eq "^nryn-runtimed[[:space:]]+${VERSION//./\\.}\$" <<<"${ver%%$'\n'*}"
          deps="$(ldd /tmp/unpack/nryn-runtimed 2>&1 || true)"
          if grep -q '=>' <<<"$deps"; then
            echo "::error::nryn-runtimed is dynamically linked"; exit 1
          fi
          # the engine's own invariants on a generated tiny model
          (cd src && go run ./internal/testmodel/cmd/gen -o /tmp/tiny.gguf)
          /tmp/unpack/nryn-runtimed verify -m /tmp/tiny.gguf
          { echo "SOURCE_COMMIT=$SOURCE_COMMIT"; echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"; } > out/assets/.meta
          # what this runner built for both architectures, for the sign job
          # to compare with the other runner's (a reproducibility check)
          (cd out && sha256sum amd64/nryn-runtimed arm64/nryn-runtimed) > out/assets/.cross

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.arch }}
          path: out/assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write   # keyless cosign signature, and nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: in

      - name: Assemble the assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir assets
          for d in in/build-*; do
            cp "$d"/nryn-runtime_* assets/
          done
          for meta in in/build-*/.meta; do
            cp "$meta" release.meta
            break
          done
          for a in amd64 arm64; do
            test -f "assets/nryn-runtime_${VERSION}_linux_${a}.tar.gz"
          done
          # Each runner built both architectures from the same source and
          # toolchain: the two must agree byte for byte, or the build is not
          # reproducible and nothing is signed.
          if ! cmp -s in/build-amd64/.cross in/build-arm64/.cross; then
            echo "::error::the amd64 and arm64 runners built different binaries"
            cat in/build-amd64/.cross in/build-arm64/.cross
            exit 1
          fi
          cat > assets/COPYLEFT-NONE.txt <<EOF
          Nryn Runtime ${VERSION}: no copyleft component requires its source to accompany
          this release. nryn-runtimed is a static Go executable that links only the Go
          standard library and runtime (BSD-3-Clause); its CycloneDX SBOM and
          THIRD_PARTY_NOTICES.md list it. The source module requires no other module.
          EOF
          (cd assets && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS assets/
          cat assets/SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The release Nryn OS's own build pins (build.sh COSIGN_VERSION), so
          # the bundle format is one every Nryn verifier reads; move with it.
          cosign-release: v2.5.2

      - name: Sign SHA256SUMS (keyless)
        working-directory: assets
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/nryn-ai/runtime-releases/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum -c SHA256SUMS
          mv ../release.meta .meta

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # gh release create, and nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: assets

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2

      - name: Verify what is about to be published
        working-directory: assets
        run: |
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/nryn-ai/runtime-releases/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum -c SHA256SUMS
          for f in *; do
            case "$f" in SHA256SUMS|SHA256SUMS.sigstore.json) continue ;; esac
            grep -Eq "^[0-9a-f]{64}  ${f//./\\.}\$" SHA256SUMS || { echo "::error::$f is not in SHA256SUMS"; exit 1; }
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # shellcheck disable=SC1091
          . assets/.meta
          cat > notes.md <<EOF
          Nryn Runtime ${VERSION}: \`nryn-runtimed\` for Nryn OS, built from nryn-ai/runtime at
          ${GITHUB_REF_NAME} (\`${SOURCE_COMMIT}\`) by this repository's release workflow.

          | Asset | |
          |---|---|
          | \`nryn-runtime_${VERSION}_linux_amd64.tar.gz\` | Linux x86-64: \`nryn-runtimed\`, \`THIRD_PARTY_NOTICES.md\` |
          | \`nryn-runtime_${VERSION}_linux_arm64.tar.gz\` | Linux aarch64: likewise |
          | \`nryn-runtime_${VERSION}_linux_<arch>.cdx.json\` | CycloneDX 1.6 SBOM |
          | \`nryn-runtime_${VERSION}_linux_<arch>.THIRD_PARTY_NOTICES.md\` | third-party notices (also in the tarball) |
          | \`COPYLEFT-NONE.txt\` | no copyleft component |
          | \`SHA256SUMS\`, \`SHA256SUMS.sigstore.json\` | checksums of every asset, keyless cosign signature |

          Verify:

          \`\`\`
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\
            --certificate-identity "https://github.com/nryn-ai/runtime-releases/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum -c SHA256SUMS
          \`\`\`

          This release is immutable: it is never edited or replaced.
          EOF
          rm assets/.meta
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Nryn Runtime ${VERSION}" --notes-file notes.md assets/*
